name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  commit-convention:
    name: Conventional Commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Validate PR title and every commit
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Same Conventional Commits grammar as .githooks/commit-msg.
          pattern='^(feat|fix|refactor|docs|test|ci|chore|perf|style|build|revert)(\(.+\))?!?: .+'
          fail=0

          # The PR title is the squash subject when a PR has >1 commit.
          if ! printf '%s' "$PR_TITLE" | grep -qE "$pattern"; then
            echo "::error::PR title is not a Conventional Commit: $PR_TITLE"
            fail=1
          fi

          # Every commit in the PR: with squash_title=COMMIT_OR_PR_TITLE a
          # single-commit PR uses the COMMIT message as the subject on main,
          # and rebase/merge-commit land the commits verbatim — so each must
          # conform too. Merge/Revert commits are exempt (as in the hook).
          while IFS= read -r sha; do
            [ -z "$sha" ] && continue
            msg=$(git log -1 --format=%s "$sha")
            printf '%s' "$msg" | grep -qE '^(Merge |Revert )' && continue
            if ! printf '%s' "$msg" | grep -qE "$pattern"; then
              echo "::error::Commit ${sha:0:8} is not a Conventional Commit: $msg"
              fail=1
            fi
          done < <(git rev-list "$BASE_SHA..$HEAD_SHA")

          if [ "$fail" -ne 0 ]; then
            echo "Format: <type>(<scope>): <description>  — types: feat, fix, refactor, docs, test, ci, chore, perf, style, build, revert (optionally '!' for breaking)."
            exit 1
          fi

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libopus-dev libvorbis-dev libavahi-compat-libdnssd-dev pkg-config
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-targets --features custom-protocol -- -D warnings
      - run: cargo clippy --all-targets --features encryption -- -D warnings
      - run: cargo clippy -p snapcast-client -p snapclient-rs --all-targets --features websocket,tls,resampler,encryption,custom-protocol -- -D warnings
      - run: cargo clippy -p snapcast-server --all-targets --features opus,vorbis,f32lz4,encryption,custom-protocol -- -D warnings

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libopus-dev libvorbis-dev libavahi-compat-libdnssd-dev pkg-config
      - run: cargo test -p snapcast-proto -p snapcast-client -p snapcast-server
      - run: cargo test -p snapcast-tests
      - run: cargo test -p snapcast-tests --features custom-protocol
      - run: cargo test -p snapcast-tests --features encryption
      - run: cargo test -p snapcast-server --features opus,vorbis,f32lz4,encryption,custom-protocol

  build-linux:
    name: Build (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libopus-dev libvorbis-dev libavahi-compat-libdnssd-dev pkg-config
      - run: cargo build --release -p snapclient-rs
      - run: cargo build --release -p snapserver-rs
      - run: cargo build --release -p snapserver-rs --features opus,vorbis,f32lz4,encryption,custom-protocol

  build-macos:
    name: Build (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p snapclient-rs
      - run: cargo build --release -p snapserver-rs

  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p snapserver-rs
      - run: cargo check -p snapclient-rs
