name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Existing release tag to (re)build and upload platform binaries for
          (e.g. v0.17.0). The tag's GitHub Release must already exist — this
          only rebuilds and uploads binaries to it, using the build logic
          from this branch. Skips release-please and crates.io publish.
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      # Author the release PR with a GitHub App token, not the default
      # GITHUB_TOKEN. GitHub blocks GITHUB_TOKEN-authored PRs/pushes from
      # triggering other workflows (recursion guard), so ci.yml never ran on the
      # release PR and its required checks stayed stuck. An App token is a real
      # actor, so its pushes DO fire ci.yml.
      # continue-on-error + the `|| secrets.GITHUB_TOKEN` fallback make this a
      # no-op until the two RELEASE_PLEASE_APP_* secrets exist: without them the
      # token step fails softly and release-please falls back to GITHUB_TOKEN
      # (i.e. the old close+reopen workaround still applies).
      - uses: actions/create-github-app-token@v2
        id: app-token
        continue-on-error: true
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Decouples "which tag to build binaries for" from the auto-release path,
  # so the same build/upload logic can be re-run on demand (workflow_dispatch)
  # against an existing release without going through release-please again.
  resolve-tag:
    needs: [release-please]
    if: always() && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.release_created == 'true')
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.tag.outputs.tag_name }}
    steps:
      - id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag_name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag_name=${{ needs.release-please.outputs.tag_name }}" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build (${{ matrix.target }})
    needs: resolve-tag
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-tag.outputs.tag_name }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libavahi-compat-libdnssd-dev
      # No FLAC system dep: the `flac` feature uses flacenc (pure Rust), so the
      # release build cross-compiles to every target with no C toolchain or
      # system/Homebrew library (libasound2/avahi above are for cpal + mDNS).
      - name: Build release
        run: |
          cargo build --release --target ${{ matrix.target }} -p snapclient-rs
          cargo build --release --target ${{ matrix.target }} -p snapserver-rs --features flac
      - name: Package binaries (target triple in the filename so they don't collide)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          ext=""
          if [[ "${{ matrix.target }}" == *windows* ]]; then ext=".exe"; fi
          cp "target/${{ matrix.target }}/release/snapclient-rs${ext}" "dist/snapclient-rs-${{ matrix.target }}${ext}"
          cp "target/${{ matrix.target }}/release/snapserver-rs${ext}" "dist/snapserver-rs-${{ matrix.target }}${ext}"
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: snapcast-rs-${{ matrix.target }}
          path: dist/*

  upload-release-artifacts:
    name: Upload Release Artifacts
    runs-on: ubuntu-latest
    needs: [resolve-tag, build]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-tag.outputs.tag_name }}
          files: snapcast-rs-*/*

  crates-io:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: [release-please, build]
    if: always() && needs.release-please.outputs.release_created == 'true' && needs.build.result == 'success'
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish (order matters — proto first)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          cargo publish -p snapcast-proto || true
          sleep 30
          cargo publish -p snapcast-client || true
          sleep 30
          cargo publish -p snapcast-server || true
