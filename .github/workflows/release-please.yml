name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Existing release tag to (re)build and upload platform binaries for
          (e.g. v0.17.0). The tag's GitHub Release must already exist — this
          rebuilds and uploads binaries to it using the build logic from this
          branch. Skips release-please; crates.io publication is opt-in below.
        required: true
        type: string
      publish_crates:
        description: Publish missing library crates from the requested tag
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: release
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      # Author the release PR with a GitHub App token, not the default
      # GITHUB_TOKEN. GitHub blocks GITHUB_TOKEN-authored PRs/pushes from
      # triggering other workflows (recursion guard), so ci.yml never ran on the
      # release PR and its required checks stayed stuck. An App token is a real
      # actor, so its pushes DO fire ci.yml.
      # Both RELEASE_PLEASE_APP_* secrets exist now, so this step must not
      # be softened and the token must not have a fallback. A fallback
      # would silently produce a release PR without CI, which is exactly
      # what the App token is here to prevent.
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@v5
        id: rp
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Decouples "which tag to build binaries for" from the auto-release path,
  # so the same build/upload logic can be re-run on demand (workflow_dispatch)
  # against an existing release without going through release-please again.
  resolve-tag:
    needs: [release-please]
    if: always() && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.release_created == 'true')
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.tag.outputs.tag_name }}
    steps:
      - id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag_name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag_name=${{ needs.release-please.outputs.tag_name }}" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build (${{ matrix.target }})
    needs: resolve-tag
    if: always() && needs.resolve-tag.result == 'success'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-tag.outputs.tag_name }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libavahi-compat-libdnssd-dev
      # No FLAC system dep: the `flac` feature uses flacenc (pure Rust), so the
      # release build cross-compiles to every target with no C toolchain or
      # system/Homebrew library (libasound2/avahi above are for cpal + mDNS).
      - name: Build release
        run: |
          cargo build --release --target ${{ matrix.target }} -p snapclient-rs
          cargo build --release --target ${{ matrix.target }} -p snapserver-rs --features flac
      - name: Package binaries (target triple in the filename so they don't collide)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          ext=""
          case "${{ matrix.target }}" in
            *windows*) ext=".exe" ;;
          esac
          cp "target/${{ matrix.target }}/release/snapclient-rs${ext}" "dist/snapclient-rs-${{ matrix.target }}${ext}"
          cp "target/${{ matrix.target }}/release/snapserver-rs${ext}" "dist/snapserver-rs-${{ matrix.target }}${ext}"
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: snapcast-rs-${{ matrix.target }}
          path: dist/*

  upload-release-artifacts:
    name: Upload Release Artifacts
    runs-on: ubuntu-latest
    needs: [resolve-tag, build]
    if: always() && needs.resolve-tag.result == 'success' && needs.build.result == 'success'
    permissions:
      contents: write
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
      - uses: actions/download-artifact@v8
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ steps.app-token.outputs.token }}
          tag_name: ${{ needs.resolve-tag.outputs.tag_name }}
          files: snapcast-rs-*/*

  crates-io:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: [release-please, resolve-tag, build]
    if: >-
      always() &&
      needs.build.result == 'success' &&
      (needs.release-please.outputs.release_created == 'true' ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_crates))
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-tag.outputs.tag_name }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish libraries
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          set -euo pipefail

          metadata="$(cargo metadata --locked --no-deps --format-version 1)"

          package_version() {
            jq -er --arg name "$1" \
              '.packages[] | select(.name == $name) | .version' <<<"$metadata"
          }

          crate_is_available() {
            curl --fail --silent --output /dev/null \
              --retry 3 --retry-delay 2 \
              --user-agent "snapcast-rs-release/$2 (https://github.com/metaneutrons/snapcast-rs)" \
              "https://crates.io/api/v1/crates/$1/$2"
          }

          wait_for_crate() {
            local package_name="$1"
            local version="$2"

            for attempt in {1..20}; do
              if crate_is_available "$package_name" "$version"; then
                echo "$package_name $version is available on crates.io."
                return 0
              fi

              if (( attempt == 20 )); then
                echo "::error::$package_name $version was uploaded but did not become available on crates.io."
                return 1
              fi

              echo "Waiting for $package_name $version to become available (attempt $attempt/20)..."
              sleep 15
            done
          }

          publish_crate() {
            local package_name="$1"
            local version
            version="$(package_version "$package_name")"

            if crate_is_available "$package_name" "$version"; then
              echo "::notice::$package_name $version is already published; skipping."
              return 0
            fi

            cargo publish --locked -p "$package_name"
            wait_for_crate "$package_name" "$version"
          }

          publish_crate snapcast-proto
          publish_crate snapcast-client
          publish_crate snapcast-server
