[package]
name = "snapcast-server"
description = "Snapcast server library — embeddable synchronized multiroom audio server"
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
base64 = { workspace = true }
chacha20poly1305 = { workspace = true, optional = true }
hkdf = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
subtle = { workspace = true }
snapcast-proto = { workspace = true }
tokio = { workspace = true }
socket2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }

# Encoders — all optional
libflac-sys = { version = "0.3", optional = true }
audiopus = { workspace = true, optional = true }
audiopus_sys = { version = "0.1.8", optional = true, features = ["dynamic"] }
vorbis_rs = { version = "0.5", optional = true }
ogg = { version = "0.9", optional = true }
lz4_flex = { version = "0.13.0", optional = true }
uuid = { version = "1.23.0", features = ["v4"] }
getrandom = "0.4.2"

[features]
default = ["flac"]
flac = ["dep:libflac-sys"]
opus = ["dep:audiopus", "dep:audiopus_sys"]
vorbis = ["dep:vorbis_rs", "dep:ogg"]
f32lz4 = ["dep:lz4_flex"]
encryption = ["f32lz4", "dep:chacha20poly1305", "dep:hkdf", "dep:sha2"]
custom-protocol = ["snapcast-proto/custom-protocol"]

[dev-dependencies]

[package.metadata.docs.rs]
all-features = false
features = ["f32lz4", "custom-protocol", "encryption"]
